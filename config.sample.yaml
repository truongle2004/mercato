environment: production
http_port: 8888
grpc_port: 8889
auth_secret: ######

database_uri: postgres://username:password@host:5432/database

redis_uri: localhost:6379
redis_password:
redis_db: 0

# OpenTelemetry tracing. Enable when an OTLP collector is available.
telemetry_enabled: false
telemetry_service_name: mercato
telemetry_otlp_endpoint: localhost:4317
telemetry_otlp_insecure: true

# CORS / rate limiting (optional — defaults: "*", 100 req / 60s)
cors_allowed_origins: "*"
rate_limit_requests: 100
rate_limit_window_seconds: 60

# Auth mode: "jwt" (default) or "oidc"
auth_mode: jwt

# OIDC / Authentik — only required when auth_mode = oidc
oidc_issuer: https://auth.cunghoclaptrinh.online/application/o/mercato-api/
oidc_client_id: mercato-api-client
oidc_client_secret: ######
oidc_redirect_url: https://mercato.cunghoclaptrinh.online/api/v1/auth/callback
oidc_jwks_url: https://auth.cunghoclaptrinh.online/application/o/mercato-api/jwks/
oidc_scopes: openid,email,profile
# Where the OIDC callback redirects the browser after minting Mercato tokens.
frontend_base_url: https://mercato.cunghoclaptrinh.online

# Headless Authentik (auth_mode = oidc only). API base is the server URL
# without trailing slash; the admin token is a long-lived API token created
# under Directory → Tokens.
authentik_api_base: https://auth.cunghoclaptrinh.online
authentik_admin_token: ######
# Authentication flow slug used by flow executor for headless password
# verification. Must contain only Identification + Password stages.
authentik_flow_slug: mercato-ropg

# Stripe — required for payments. webhook_secret is given by `stripe listen`
# or the dashboard; api_base is only set in tests to point at stripe-mock.
stripe_secret_key: sk_test_xxx
stripe_webhook_secret: whsec_xxx
stripe_publishable_key: pk_test_xxx
stripe_api_base:

# SMTP — required for transactional email (order receipts, etc.).
# In dev, point at MailHog: smtp_host=localhost, smtp_port=1025.
smtp_host:
smtp_port: 25
smtp_user:
smtp_password:
email_from: no-reply@mercato.local
